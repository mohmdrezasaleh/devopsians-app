stages: [test, build, scan, deploy]

variables:
  IMAGE: $CI_REGISTRY_IMAGE
  PIP_INDEX_URL: "https://mirror-pypi.runflare.com/simple/"
  PIP_DEFAULT_TIMEOUT: "60"
  PIP_RETRIES: "5"

test:
  stage: test
  image: python:3.11-slim
  script:
    - pip install -r app/requirements.txt -r app/requirements-dev.txt
    - cd app && python -m pytest -q

build:
  stage: build
  image: docker:27
  services:
    - name: docker:27-dind
      command:
        - "--insecure-registry=195.24.237.134:5050"
        - "--registry-mirror=https://docker.arvancloud.ir"
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - >
      docker build
      --build-arg PIP_INDEX_URL=$PIP_INDEX_URL
      -t $IMAGE:$CI_COMMIT_SHORT_SHA
      -t $IMAGE:latest .
    - docker push $IMAGE:$CI_COMMIT_SHORT_SHA
    - docker push $IMAGE:latest
  only: [main]

scan:
  stage: scan
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  variables:
    TRIVY_USERNAME: $CI_REGISTRY_USER
    TRIVY_PASSWORD: $CI_REGISTRY_PASSWORD
    TRIVY_INSECURE: "true"
    TRIVY_NO_PROGRESS: "true"
    TRIVY_DB_REPOSITORY: "mirror.gcr.io/aquasec/trivy-db,ghcr.io/aquasecurity/trivy-db"
  script:
    - trivy image --severity HIGH,CRITICAL --exit-code 0 $IMAGE:$CI_COMMIT_SHORT_SHA
  only: [main]

update-gitops:
  stage: deploy
  image: 
    name: alpine/git:latest
    entrypoint: [""]
  variables:
    GIT_SSL_NO_VERIFY: "true"
  script:
    - git config --global user.email "ci@devopsians.local"
    - git config --global user.name "GitLab CI"
    - git clone "https://oauth2:${GITOPS_TOKEN}@195.24.237.134/devops/devopsians-gitops.git" gitops
    - cd gitops
    - |
      sed -i "s|^\(\s*tag:\s*\).*|\1\"${CI_COMMIT_SHORT_SHA}\"|" apps/devopsians-workload/values-prod.yaml
    - git diff --stat
    - |
      git commit -am "ci(image): update tag to ${CI_COMMIT_SHORT_SHA} [skip ci]"
    - git push origin main
  only: [main]
